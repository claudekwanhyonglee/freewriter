<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Freewriter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <textarea id="editor" spellcheck="false" autofocus aria-label="Write"></textarea>
  <nav id="controls" aria-label="Controls">
    <button data-action="toggleSidebar" data-shortcut="O" aria-label="Sessions">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button data-action="newSession" data-shortcut="N" aria-label="New session">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button data-action="textSmaller" data-shortcut="-" aria-label="Text smaller">
      <svg viewBox="0 0 24 24"><path d="M3 18l4.5-10L12 18M4.6 14.5h5.8M15 13h6"/></svg>
    </button>
    <button data-action="textBigger" data-shortcut="=" aria-label="Text bigger">
      <svg viewBox="0 0 24 24"><path d="M3 18l4.5-10L12 18M4.6 14.5h5.8M15 13h6M18 10v6"/></svg>
    </button>
    <button data-action="toggleFullscreen" data-key="F11" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
    </button>
  </nav>
  <aside id="sidebar" hidden aria-label="Sessions">
    <ul id="session-list"></ul>
  </aside>
  <script src="renderer.js"></script>
</body>
</html>
